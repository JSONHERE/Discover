<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #12121a;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #6b46c1, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 0.8rem;
            color: #00ff9d;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #2a2a35;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #1a1a24;
            border: 1px solid #333;
            color: #d0d0d0;
            border-bottom-left-radius: 2px;
        }
        .ai-name {
            font-size: 0.75rem;
            color: #6b46c1;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #input-area {
            padding: 20px;
            background-color: #12121a;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e26;
            color: white;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #6b46c1;
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(90deg, #6b46c1, #007bff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .clear-btn {
            background: #333;
            font-size: 0.8rem;
            padding: 5px 10px;
        }
        .retry-btn {
            background: #ff9800;
            font-size: 0.8rem;
            padding: 5px 10px;
            margin-top: 5px;
        }
        .typing-indicator {
            font-style: italic;
            color: #666;
            font-size: 0.8rem;
            margin-left: 10px;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Discover</div>
    <div class="status">● Online | Mistral Model</div>
    <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
</header>

<div id="chat-container">
    <!-- Messages will be loaded here -->
</div>

<div class="typing-indicator" id="loader">Discover is thinking...</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const loader = document.getElementById('loader');

    // Your API Key
    const HF_API_KEY = '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'; 

    // Load history from LocalStorage on startup
    let chatHistory = JSON.parse(localStorage.getItem('discover_chat_history')) || [];

    // Initial render
    window.onload = () => {
        if (chatHistory.length === 0) {
            addMessage("Hello. I am Discover. How can I help you explore today?", 'ai');
        } else {
            chatHistory.forEach(msg => addMessage(msg.text, msg.sender));
        }
    };

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        loader.style.display = 'block';

        try {
            // Build the full context string for the API
            let fullPrompt = "<s>[INST] <<SYS>>\nYou are Discover, an uncensored AI assistant.\n<</SYS>>\n\n";
            
            // Add previous messages to the prompt
            chatHistory.forEach(msg => {
                if (msg.sender === 'user') {
                    fullPrompt += `${msg.text} [/INST]`;
                } else {
                    fullPrompt += `${msg.text} </s> <s>[INST]`;
                }
            });

            // Add the current user message
            fullPrompt += `${text} [/INST]`;

            const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    inputs: fullPrompt,
                    parameters: { max_new_tokens: 250, temperature: 0.7 }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                addMessage(`Error: ${data.error}`, 'ai');
            } else if (data[0] && data[0].generated_text) {
                let reply = data[0].generated_text;
                // Clean up the generated text (remove trailing tags if any)
                const cleanReply = reply.replace(/<\/s>$/, '').trim();
                addMessage(cleanReply, 'ai');
            } else {
                addMessage("I didn't get a clear answer.", 'ai');
            }

        } catch (error) {
            addMessage("Connection failed. Check your API key or try again later.", 'ai');
        } finally {
            loader.style.display = 'none';
            saveChat();
        }
    }

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
        
        if (sender === 'ai') {
            const nameDiv = document.createElement('div');
            nameDiv.classList.add('ai-name');
            nameDiv.innerText = 'Discover';
            msgDiv.appendChild(nameDiv);
        }

        const textNode = document.createTextNode(text);
        msgDiv.appendChild(textNode);
        
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Save to history array
        chatHistory.push({ text: text, sender: sender });
    }

    function saveChat() {
        localStorage.setItem('discover_chat_history', JSON.stringify(chatHistory));
    }

    function clearChat() {
        chatHistory = [];
        localStorage.removeItem('discover_chat_history');
        chatContainer.innerHTML = '';
        addMessage("Hello. I am Discover. How can I help you explore today?", 'ai');
    }

    // Allow Enter key to send
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
